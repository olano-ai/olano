name: Secret scan

# Fails a pull request that adds anything shaped like a credential (API keys,
# tokens, private keys, passwords in URLs), using gitleaks' default rule set
# plus the exceptions in .gitleaks.toml.
#
# Two scans, because each catches what the other cannot:
#   1. Every commit the pull request (or push) adds, so a key that was
#      committed and then deleted in a later commit still fails the check. Once
#      pushed it is public in the branch history even if the final diff is clean.
#   2. The whole checked-out tree, so the check also proves the code as it
#      stands holds nothing, whatever the history looked like.
#
# No paths-ignore on purpose: a key pasted into a README leaks just as well.
#
# A finding that is a real secret: revoke it at the provider first (removing it
# from the branch does not un-publish it), then remove it. A false alarm (a test
# fixture, a lookalike): add a `gitleaks:allow` comment on that line, or, where
# a comment cannot go, an entry in .gitleaks.toml.
#
# gitleaks runs as the pinned release binary, checksum-verified, rather than
# through gitleaks-action, which needs a paid license on organization accounts.

on:
  pull_request:
  push:
    branches: [main, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.28.0"
  # sha256 of gitleaks_8.28.0_linux_x64.tar.gz, from the release's checksums file.
  GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the commit range below resolves on any base.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan the new commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base="$PR_BASE"; head="$PR_HEAD" ;;
            push)         base="$PUSH_BEFORE"; head="$PUSH_AFTER" ;;
            *)            echo "Manual run: the tree scan below covers it."; exit 0 ;;
          esac
          # A new branch has no "before", and a force-push can leave it
          # unreachable. Then there is no range to name; the tree scan covers it.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "No base commit to compare with; the tree scan below covers it."
            exit 0
          fi
          echo "Scanning commits ${base}..${head}"
          "$RUNNER_TEMP/gitleaks" git . --no-banner --redact --verbose \
            --log-opts="${base}..${head}"

      - name: Scan the tree
        run: |
          "$RUNNER_TEMP/gitleaks" dir . --no-banner --redact --verbose
