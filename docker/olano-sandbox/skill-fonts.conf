<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Fonts a skill ships, made visible to everything in the sandbox that resolves a
  face by NAME rather than by file — which in practice means LibreOffice, since
  the browser-based renderers (`render_html_image`, the charts skill) embed their
  faces as data URIs and need none of this.

  The directory is the shared tool layer, not the skill itself: a skill root is
  bind-mounted at its HOST path, which is not knowable when this image is built,
  while /opt/agent-tools is a fixed container path the runtime already writes to
  from the host side (olano/backends/interpreter_shims.py does the same for the
  `python` shim). The runtime copies the faces there; fontconfig treats a <dir>
  that does not exist as empty, so an image with no runtime behind it — or a box
  whose fonts have not been seeded yet — is unaffected rather than broken.
-->
<fontconfig>
  <dir>/opt/agent-tools/fonts</dir>
</fontconfig>
