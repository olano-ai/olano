apply plugin: 'com.android.application'

// Release signing (Google Play upload key). Nothing secret is committed: the
// values come from android/keystore.properties (git-ignored; copy
// keystore.properties.example) or, on CI, from the environment variables
// named beside each key. Without them a release build is left unsigned, and
// Android Studio's "Generate Signed App Bundle" still works.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def signingValue = { String key, String env -> keystoreProperties.getProperty(key) ?: System.getenv(env) }
def releaseStoreFile = signingValue('storeFile', 'OLANO_UPLOAD_STORE_FILE')
def releaseSigning = releaseStoreFile != null && !releaseStoreFile.isEmpty()

android {
    namespace = "ai.olano.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ai.olano.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Release checklist (mobile/README.md): versionName matches package.json
        // "version" (`npm run check:versions`); versionCode goes up by one for
        // every upload to Google Play.
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // CI passes -PolanoVersionCode=<n> so every upload carries a code Google
    // Play has not seen (like the TestFlight workflow's build number); a local
    // build uses the versionCode above.
    if (project.hasProperty('olanoVersionCode')) {
        defaultConfig.versionCode = project.property('olanoVersionCode').toString().toInteger()
    }
    signingConfigs {
        if (releaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword signingValue('storePassword', 'OLANO_UPLOAD_STORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'OLANO_UPLOAD_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'OLANO_UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // The app's own push service extends Capacitor's (OlanoMessagingService),
    // so it compiles against the same Firebase Messaging.
    implementation "com.google.firebase:firebase-messaging:${project.hasProperty('firebaseMessagingVersion') ? rootProject.ext.firebaseMessagingVersion : '25.0.1'}"
    // BiometricPrompt for the app lock (OlanoShellPlugin.unlock).
    implementation "androidx.biometric:biometric:1.1.0"
    // WebViewCompat.addDocumentStartJavaScript (MainActivity.exposeBridgeToLocalPages).
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    // WebSockets for the live browser view (OlanoHttpPlugin.socketOpen).
    implementation "com.squareup.okhttp3:okhttp:$okhttpVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
