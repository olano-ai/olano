# Secret scanning config for gitleaks (https://github.com/gitleaks/gitleaks).
# Read by the Secret scan workflow (.github/workflows/secret-scan.yml) and by a
# local `gitleaks git .` / `gitleaks dir .` run from the repository root.
#
# The default rule set stays on in full. A false alarm on a single line is
# silenced on that line with a `gitleaks:allow` comment, so the exception sits
# next to the value it covers and goes away with it. This file only lists the
# cases a comment cannot reach: generated files and values inside a string.

[extend]
useDefault = true

[[allowlists]]
description = "Generated or untracked trees that never hold a committed secret"
paths = [
  '''(^|/)__pycache__/''',
  '''(^|/)node_modules/''',
  '''(^|/)\.venv/''',
]

[[allowlists]]
description = "Relay signing golden vectors: throwaway Ed25519 test keys, regenerated by the cloud repo's gen-relay-golden-vector.py"
paths = [
  '''^tests/fixtures/relay/[a-z_]+_golden\.json$''',
]

[[allowlists]]
description = "Model catalog: litellm_key holds a model id like perplexity/sonar, not a key"
regexTarget = "match"
regexes = [
  '''^litellm_key":\s*"[a-z0-9][a-z0-9_./:-]*"$''',
]

[[allowlists]]
description = "Env-file parser fixture: a fake value inside a test string, where a comment would change the input"
regexTarget = "match"
regexes = [
  '''^LIONCLAW_MCP_RELAY_SECRET="s3cr3t=with=equals"$''',
]

[[allowlists]]
description = "Push test fixture: a made-up FCM registration token, already in this branch's history, where a comment cannot reach"
regexTarget = "match"
regexes = [
  '''^fcm-token_abc:DEF-1234567890"$''',
]
